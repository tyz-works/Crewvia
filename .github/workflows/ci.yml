name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  shell-validate:
    name: Shell Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax check)
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f" 2>&1; then
              echo "FAIL: $f"
              failed=1
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)
          exit $failed

      - name: classify_sh.sh (security scan)
        run: |
          # classify_sh.sh は SAFE=exit 0 / BLOCK=exit 1 を返す。
          # set -e 下で result=$(... classify_sh.sh ...) を直接書くと、BLOCK
          # (exit 1) の瞬間に assignment 行で即 exit してしまい、本来の
          # "BLOCK: ..." メッセージが出力されないまま workflow が失敗する
          # (CI log が sea of SAFE で終わって原因不明になる)。
          # if result=$(...); then ... else ... fi の形にすれば set -e の
          # 早期 exit を回避しつつ、exit code からそのまま BLOCK 判定できる。
          failed=0
          while IFS= read -r -d '' f; do
            if result=$(bash scripts/shared/classify_sh.sh "$f" 2>&1); then
              echo "SAFE: $f"
            else
              echo "BLOCK: $f — $result"
              failed=1
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*" -not -path "./scripts/shared/classify_sh.sh" -print0)
          exit $failed

  yaml-validate:
    name: YAML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: YAML syntax check
        run: |
          python3 - <<'EOF'
          import sys, pathlib, yaml

          failed = False
          for p in pathlib.Path('.').rglob('*.yaml'):
              if '.git' in p.parts:
                  continue
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  print(f"FAIL: {p} — {e}")
                  failed = True

          sys.exit(1 if failed else 0)
          EOF

  # scripts/test_*.sh を glob で全部走らせる。名指しの一覧は持たない（足したテストが黙って CI の外に
  # 残らないように）。走らせないものは scripts/ci-script-tests-excluded.txt の「理由付き」行だけ。
  # 1 本ずつ走らせて結果を出し、1 本落ちても残りは止めない。knowledge/ci-script-tests.md
  script-tests:
    name: scripts/test_*.sh (all, minus the reasoned allowlist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test_handoff_path.sh が git worktree add をする

      - name: git identity (harness runs `git init` / `git worktree add` in isolated fixtures)
        run: |
          git config --global user.email "ci@crewvia.local"
          git config --global user.name "Crewvia CI"

      # test_retirement_authority.sh は実 tmux に窓を立てる（偽 tmux では作れない状態を検査する）。
      - name: Install tmux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          tmux -V

      - name: scripts/ci-run-script-tests.sh
        run: bash scripts/ci-run-script-tests.sh

  # tests/*.sh を glob で全部走らせる（t063 / backlog #30 P3-3）。script-tests job
  # とは別 job にする — 対象ディレクトリも走る本数の比率も逆 (大半が理由付き除外で
  # RUN はごく少数) で、script-tests job 特有の setup (tmux / git identity) を
  # 必要としない。knowledge/ci-script-tests.md
  tests-sh-tests:
    name: tests/*.sh (all, minus the reasoned allowlist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: scripts/ci-run-tests-sh.sh
        run: bash scripts/ci-run-tests-sh.sh

  bats:
    name: Bats Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats tests/*.bats

  pytest:
    name: Python Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pyyaml

      # tests/test_daemon_husk_respawn.py はデーモンが死んでも pane が残る形
      # (husk) を実 tmux 窓で再現する。偽 tmux では作れない状態なので、tmux が
      # 無いと skip され、t006 QA FAIL-1 の回帰が CI で誰にも見えなくなる。
      - name: Install tmux (required by the husk respawn regression)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          tmux -V

      - name: Run pytest
        run: python3 -m pytest tests/ -v
