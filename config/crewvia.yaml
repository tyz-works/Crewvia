# crewvia.yaml
# Crewvia システム全体の設定ファイル
# このファイルを編集することでシステムの挙動をユーザー側で調整できます。
#
# 環境変数は常に config ファイルより優先されます。
# 一時的な上書きは env var を使い、永続的な変更はこのファイルを編集してください。

# ===== WIP 制限 =====
# 同時に稼働できる Worker の最大数。Director はこの値を超えて Worker を
# 起動しないようにします。タスクがブロックされる等の緊急時のみ、Director の
# 判断で一時的に超過できます（director.md §7 の WIP 制限の例外 参照）。
#
# 環境変数での上書き: CREWVIA_WIP_LIMIT=12
wip_limit: 8

# ===== モデル選択 =====
# Director と Worker が起動時に使う Claude モデルを指定します。
# 空にすると claude CLI のデフォルト（ユーザーの /model 設定）に従います。
#
# 利用可能な ID (2026-09 時点で claude CLI 2.1.263 に受理確認済み):
#   claude-opus-5              ← 最高性能。計画・調整・レビュー向き
#   claude-sonnet-5            ← バランス型。実装・汎用作業向き (worker_model のデフォルト)
#   claude-haiku-4-5-20251001  ← 高速・低コスト。ただし permission-mode auto を無視するので Worker には使わない
#
# 環境変数での上書き:
#   CREWVIA_DIRECTOR_MODEL=claude-opus-5
#   CREWVIA_WORKER_MODEL=claude-sonnet-5
director_model: claude-opus-5
worker_model: claude-sonnet-5

# ===== skill 別モデル選択 =====
# skill に応じて Worker のモデルを自動で切り替えます。
# 複数 skill が指定された場合は、最も要求の高いモデル (opus > sonnet > haiku) が採用されます。
# ここに列挙されていない skill は worker_model にフォールバックします。
#
# Worker 起動時に CREWVIA_WORKER_MODEL が明示的に設定されていれば、
# この設定より優先されます（env var 最優先）。
model_per_skill:
  planning:    claude-opus-5
  plan_review: claude-opus-5
  review:      claude-opus-5
  research:    claude-opus-5
  # docs / qa / verify を Haiku にしない: Haiku は --permission-mode auto を無視して承認
  # ダイアログで止まる (t028 / backlog #16)。以前は起動のたびに CREWVIA_WORKER_MODEL で上書きしていた。
  docs:        claude-sonnet-5
  qa:          claude-sonnet-5
  verify:      claude-sonnet-5
  # 未定義の skill (bash / code / typescript / python / database / cloud / ops)
  # は worker_model にフォールバックする

# ===== 起動モード =====
# tmux   — Director + Worker を tmux セッション "crewvia" 内に展開（並列 Worker 可）
# herdr  — Director + Worker を herdr workspace "crewvia" 内に展開（並列 Worker 可）
#          herdr モードでは先に herdr を起動し、その中で bash scripts/start.sh director を実行すること
# inline — 単独プロセスで起動（Worker 並列不可、デバッグ向き）
#
# 環境変数での上書き: CREWVIA_MUX=tmux|herdr (最優先) / CREWVIA_MUX_ENABLED=1 (並列 ON) / CREWVIA_MUX_ENABLED=0 (inline)
# CREWVIA_MUX が設定されていれば CREWVIA_MUX_ENABLED より優先される。
mode: herdr  # 戻す時は tmux。切替日: 2026-09-04

# ===== mux 設定 =====
mux:
  # Rule 5 (herdr モードのみ): Worker の agent_status が blocked または
  # idle-with-task (idle/done かつ assignment ファイルあり) の状態が
  # この秒数連続して続いたとき、Director に通知する。
  # tmux モードでは agent_status が取得できないため、この設定は使用されない。
  #
  # 環境変数での上書き: CREWVIA_STATE_GRACE=<秒数>
  state_grace_seconds: 60

# ===== デーモンの相互監視 (dispatcher / watchdog) =====
# dispatcher と watchdog は互いの heartbeat を見張り、相手が死んでいたら
# 起こし直して Director に事後報告します（外部 supervisor は使いません）。
# 判定は常に fail closed — 確証が無いときは respawn せず保留します。
# 実装: scripts/lib_daemon_watch.py / 設計: knowledge/daemon-authority.md §7
daemons:
  # 相互監視そのものの ON/OFF。切ると両デーモンは t005 以前と同じく
  # 互いを知らないまま動きます（片方が死んでも誰も気付きません）。
  # 環境変数での上書き: CREWVIA_DAEMON_MUTUAL_WATCH=0
  mutual_watch: true

  # heartbeat がこの秒数より古くなったら「stale」とみなし、**そこから**
  # プロセスとタブの実在確認に進みます（stale だけでは死亡と判定しません）。
  #
  # サイクル周期に対して十分な余裕を取ること。ここを詰めすぎると、1 回遅い
  # サイクルが「死亡」に見え、生きているデーモンの隣にもう 1 つ起動してしまう
  # ＝同じ task が 2 人の Worker に渡る、という最悪の壊れ方になります。
  #   dispatcher: 5 秒周期 → 12 サイクル分
  #   watchdog  : 30 秒周期 → 8 サイクル分。加えて graceful_terminate() が
  #               最大 70 秒メインループを止めるので、その分の余裕も要る
  dispatcher_stale_seconds: 60
  watchdog_stale_seconds: 240

  # respawn 直後の猶予。起動したてのデーモンはまだ heartbeat を書いておらず、
  # 「死んでいる」のと区別がつかないため、この秒数は判定しません。
  respawn_grace_seconds: 120

  # flap ガード: この時間窓の中で respawn がこの回数に達したら、自動 respawn を
  # やめて Director に対応を求める通知に格上げします（起動直後に落ちるデーモンを
  # 延々と起こし続けないため）。
  flap_window_seconds: 900
  flap_threshold: 3

  # 保留 (hold) がこの秒数続いたら Director に 1 度だけ報告します。
  # 黙って保留し続けるのは無音の故障なので、必ず出口を用意しておくための値。
  hold_report_after_seconds: 1800

  # デーモン 1 つにつき 1 つのロック (registry/daemons/<name>.lock) で、
  # 「相手を起こす判定〜spawn」と「手動 restart」を直列化します。マーカーを
  # 先に書くだけでは閉じません — 相手が「マーカーは無い」と読んだ後に
  # maintenance が始まれば、そのまま手動 spawn と並んで起動してしまうためです。
  #
  #   watch 側: 短く。取れなければ 1 サイクル保留するだけなので安全側であり、
  #            ここで待たせると相互監視が自分のデーモンのサイクルを止める
  #   maintenance 側: 長く。人が端末の前で待っている操作なので、進行中の
  #            判定が終わるまで並ぶのが正しい
  watch_lock_timeout_seconds: 2
  maintenance_lock_timeout_seconds: 60

  # 停止マーカー (registry/daemons/<name>.paused) がこの秒数残っていたら
  # Director に 1 度だけ報告します。マーカーは自動で外しません — 「古い」は
  # 「作業が終わった」の証拠ではなく、作業途中の相手を起こすと二重起動になるため。
  pause_report_after_seconds: 1800

# ===== Taskvia 連携 =====
# Taskvia 承認フローの使用モードを指定します。
#
#   ask      — 起動時に対話プロンプトで選択（デフォルト）
#   enabled  — 常に Taskvia 承認ゲートとログ投稿を使用（TASKVIA_TOKEN 必須）
#   disabled — Taskvia を完全無効化（スタンドアロン動作、トークン不要）
#
# 優先順位: env CREWVIA_TASKVIA > --taskvia/--no-taskvia フラグ > このキー
# 環境変数での上書き: CREWVIA_TASKVIA=enabled|disabled|ask
# CLI フラグでの上書き: ./crewvia --taskvia | ./crewvia --no-taskvia
taskvia: ask

# Taskvia WebUI の URL。
# 環境変数での上書き: TASKVIA_URL=https://...
taskvia_url: https://taskvia.vercel.app

# Taskvia API トークン。
# セキュリティのため、トークンは config/.taskvia-token に記載してください（gitignore 済み）。
# ファイルが存在しない場合はスタンドアロンモードで起動します。
# 環境変数での上書き: TASKVIA_TOKEN=sk-...

# ===== 承認チャネル設定 =====
# ツール実行の承認通知をどのチャネルで受け取るかを設定します。
#
# mode:
#   taskvia  — Taskvia WebUI 経由（Taskvia 側で ntfy を送信）。デフォルト。
#   ntfy     — Crewvia から直接 ntfy を送信（WebUI は使わない）
#   both     — Crewvia から ntfy 送信 + Taskvia WebUI の両方
#
# 環境変数での上書き: CREWVIA_APPROVAL_CHANNEL=taskvia|ntfy|both
approval_channel:
  mode: taskvia

  ntfy:
    # ntfy サーバーの URL（例: https://ntfy.sh または自己ホスト）
    # 環境変数: NTFY_URL
    url: "https://ntfy.elni.net"

    # 通知を受け取るトピック名。必ず環境変数 NTFY_TOPIC で設定すること。
    # ntfy ACL: taskvia-approval-* パターンのみ iphone ユーザーが subscribe 可能。
    # 環境変数: NTFY_TOPIC (必須 — ここには書かず env var で注入)
    topic: ""

    # Basic 認証。ntfy サーバーが auth-default-access: deny-all の場合は必須。
    # セキュリティのため値はここに書かず、環境変数で設定すること。
    # 環境変数: NTFY_USER / NTFY_PASS (必須 — 空のまま運用すると 401 で通知失敗)
    user: ""
    pass: ""

    # ntfy アクションボタン用トークンの TTL（秒）
    # Taskvia 側の APPROVAL_TOKEN_TTL_SECONDS と合わせること（デフォルト: 900）
    # 環境変数: APPROVAL_TOKEN_TTL_SECONDS
    token_ttl_seconds: 900
