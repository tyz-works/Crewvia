# config/skill-permissions.yaml
# スキル別ツール権限定義
#
# allow: このスキルのタスクで自動許可するツールパターン
# deny:  このスキルのタスクで自動拒否するツールパターン
#
# パターン構文:
#   - ツール名そのまま: "Edit", "Write", "MultiEdit"
#   - Bash コマンド:    "Bash(npm *)", "Bash(git *)"
#   - ワイルドカード:   fnmatch 準拠 (* は任意文字列)
#
# SAFE_TOOLS (Read, Grep, Glob, WebSearch 等) は hook で既にスキップされるため
# ここに記載不要。
#
# 判定フロー:
#   1. _global.deny にマッチ → 即拒否 (urgent でもオーバーライド不可)
#   2. タスク skills の deny にマッチ → 拒否 (urgent なら Taskvia 例外承認)
#   3. タスク skills の allow にマッチ → 即許可 (Taskvia スキップ)
#   4. どちらにもマッチしない → 既存 Taskvia フローへ fallthrough

# 全スキル共通の絶対禁止 (urgent でもオーバーライド不可)
_global:
  deny:
    - "Bash(rm -rf *)"
    - "Bash(sudo *)"
    - "Bash(curl*| sh*)"
    - "Bash(curl*|sh*)"
    - "Bash(curl*| bash*)"
    - "Bash(curl*|bash*)"
    - "Bash(wget*| sh*)"
    - "Bash(wget*|sh*)"
    - "Bash(wget*| bash*)"
    - "Bash(wget*|bash*)"
    - "Bash(git push origin main*)"
    - "Bash(git push origin master*)"
    - "Bash(git push --force*)"
    - "Bash(git push -f *)"

skills:
  bash:
    allow:
      - "Bash(*)"
      - "Edit"
      - "Write"
      - "MultiEdit"
    deny:
      - "Bash(terraform destroy*)"
      - "Bash(kubectl delete*--all*)"

  ops:
    allow:
      - "Bash(*)"
      - "Edit"
      - "Write"
      - "MultiEdit"
    deny:
      - "Bash(terraform destroy*)"

  code:
    allow:
      - "Edit"
      - "Write"
      - "MultiEdit"
      - "Bash(npm *)"
      - "Bash(npx *)"
      - "Bash(tsc *)"
      - "Bash(eslint *)"
      - "Bash(prettier *)"
      - "Bash(git *)"
      - "Bash(gh pr create*)"
      - "Bash(gh pr view*)"
      - "Bash(gh run *)"
    deny: []

  python:
    allow:
      - "Edit"
      - "Write"
      - "MultiEdit"
      - "Bash(python*)"
      - "Bash(pip *)"
      - "Bash(pytest *)"
      - "Bash(git *)"
      - "Bash(gh pr create*)"
      - "Bash(gh pr view*)"
      - "Bash(gh run *)"
    deny: []

  typescript:
    allow:
      - "Edit"
      - "Write"
      - "MultiEdit"
      - "Bash(npm *)"
      - "Bash(npx *)"
      - "Bash(tsc *)"
      - "Bash(node *)"
      - "Bash(bun *)"
      - "Bash(git *)"
      - "Bash(gh pr create*)"
      - "Bash(gh pr view*)"
      - "Bash(gh run *)"
    deny: []

  research:
    allow: []
    deny:
      - "Edit"
      - "Write"
      - "MultiEdit"
      - "Bash(git push *)"

  review:
    allow:
      - "Bash(gh pr *)"
      - "Bash(gh api *)"
      - "Bash(gh-app-review *)"
      - "Bash(gh run *)"
      - "Bash(git diff*)"
      - "Bash(git log*)"
      - "Bash(git show*)"
      - "Bash(git fetch*)"
      - "Bash(git branch*)"
      - "Bash(git status*)"
      - "Bash(git rev-parse*)"
      - "Bash(git checkout*)"
      - "Bash(git merge*)"
      - "Bash(npm test*)"
      - "Bash(npm run lint*)"
      - "Bash(npm run typecheck*)"
      - "Bash(npm run build*)"
    deny:
      - "Edit"
      - "Write"
      - "MultiEdit"

  # codex-review: Kai-codex (scripts/kai-review.sh) 専用 skill。
  # 実際の実行は Codex CLI プロセスであり Claude Code の PreToolUse hook
  # (hooks/pre-tool-use.sh) を一切経由しないため、ここでの allow/deny は
  # 実行時には適用されない。`plan.sh lint` の
  # 「skill 'codex-review' not in skill-permissions.yaml」警告 (Phase 2 の
  # 積み残し) を解消するための、既知スキル一覧への登録のみが目的。
  # 参考として review skill 相当の意図 (read-only な gh/git 操作 + レビュー
  # レポート) をコメントで残す。
  codex-review:
    allow: []
    deny: []

  database:
    allow:
      - "Edit"
      - "Write"
      - "MultiEdit"
      - "Bash(psql *)"
      - "Bash(sqlite3 *)"
      - "Bash(git *)"
    deny:
      - "Bash(*DROP *)"
      - "Bash(*TRUNCATE *)"
      - "Bash(*DELETE FROM *)"

  cloud:
    allow:
      - "Bash(oci *)"
      - "Bash(aws *)"
      - "Edit"
      - "Write"
      - "MultiEdit"
    deny:
      - "Bash(terraform destroy*)"

  docs:
    allow:
      - "Edit"
      - "Write"
      - "MultiEdit"
      - "Bash(git *)"
    deny: []

  qa:
    allow:
      - "Edit"
      - "Write"
      - "MultiEdit"
      - "Bash(npm test*)"
      - "Bash(npm run *)"
      - "Bash(npx playwright*)"
      - "Bash(pytest *)"
      - "Bash(node *)"
      - "Bash(git diff*)"
      - "Bash(git log*)"
      - "Bash(git status*)"
      - "Bash(git fetch*)"
      - "Bash(git show*)"
      - "Bash(git branch*)"
      - "Bash(git rev-parse*)"
      - "Bash(gh pr *)"
      - "Bash(curl -s *)"
      - "Bash(kill *)"
    deny:
      - "Bash(git push*)"
      - "Bash(git commit*)"
      - "Bash(gh pr merge*)"

  verify:
    allow:
      - "Read(**)"
      - "Grep(**)"
      - "Glob(**)"
      - "Bash(npm test*)"
      - "Bash(npm run lint*)"
      - "Bash(npm run typecheck*)"
      - "Bash(git diff*)"
      - "Bash(git log*)"
      - "Bash(python3 scripts/verify-task.sh*)"
    deny:
      # hooks/pre-tool-use.sh:157-161 は非 Bash ツールに bare token を渡すため
      # bare 形式で記述する (research / review skill と同様)。`Edit(**)` 等は
      # never-match だったため削除。intent は agents/verifier.md にも記載通り
      # 「コード変更なし、検証のみ」。
      - "Edit"
      - "Write"
      - "MultiEdit"
      - "Bash(git commit*)"
      - "Bash(git push*)"
      - "Bash(rm*)"
      - "Bash(mv*)"

  planning:
    allow:
      - "Bash(*/plan.sh status*)"
      - "Bash(*/plan.sh pull*)"
      - "Bash(git log*)"
      - "Bash(git diff*)"
    deny:
      # bare 形式: research / review skill と同じ規約。hook の bare token
      # signature と一致させる。planning は plan.sh status/pull で読むだけ。
      - "Edit"
      - "Write"
      - "MultiEdit"
      - "Bash(git commit*)"
      - "Bash(git push*)"

  plan_review:
    allow:
      - "Read(**)"
      - "Grep(**)"
      - "Glob(**)"
      # hook (pre-tool-use.sh) は非 Bash ツールに bare な tool 名 (`Write` 等) を
      # signature として渡すため、bare token で記述する。ここでの allow はパスを
      # 区別しない (どの Write でも許可) が、pre-tool-use.sh 側に専用の構造的
      # ガード ("Plan-review write scope guard", t002) があり、実際に書き込める
      # のは queue/missions/<slug>/plan_review.md だけに制限されている。
      # このセクションの allow だけを見て「mission.yaml にも書ける」と誤解しない
      # こと — 過去に agent prompt 層のお願いだけに頼っていた頃、実際に
      # mission.yaml が規格外の値に書き換えられた事故がある (t002 Description 参照)。
      - "Write"
    deny:
      # bare token は hook signature と完全一致。`Edit(**)` 等は将来 hook が
      # file_path を含めるよう拡張された際の保険として残す。
      - "Edit"
      - "Edit(**)"
      - "MultiEdit"
      - "MultiEdit(**)"
      - "Bash(**)"
